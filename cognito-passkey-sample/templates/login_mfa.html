{% extends "base.html" %}
{% block title %}認証コードの確認{% endblock %}

{% block content %}
<div style="max-width: 380px; margin: 4rem auto;">
  <div class="card">
    <h1 style="text-align:center; margin-bottom:0.5rem;">2段階認証</h1>
    <p style="text-align:center; font-size:0.9rem; color:#666; margin-bottom:1.5rem;">
      認証アプリに表示されている6桁のコードを入力してください
    </p>
    {% if error %}
    <p style="color:#e74c3c; font-size:0.88rem; margin-bottom:1rem; text-align:center;">✗ {{ error }}</p>
    {% endif %}
    <form method="POST">
      <div class="form-group">
        <label for="code">認証コード</label>
        <input type="text" id="code" name="code"
               inputmode="numeric" pattern="[0-9]*" maxlength="6"
               autocomplete="one-time-code" autofocus
               placeholder="000000"
               style="text-align:center; font-size:1.4rem; letter-spacing:0.3em;">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">
        確認
      </button>
    </form>
    <p style="text-align:center; margin-top:1.2rem; font-size:0.85rem; color:#999;">
      <a href="{{ url_for('login') }}">ログイン画面に戻る</a>
    </p>
  </div>
</div>
{% endblock %}
