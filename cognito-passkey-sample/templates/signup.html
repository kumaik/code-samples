{% extends "base.html" %}
{% block title %}新規登録{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
  <div class="card">
    <h1 style="text-align:center; margin-bottom:0.75rem;">新規登録</h1>
    <p style="font-size:0.85rem; color:#666; text-align:center; margin-bottom:1.5rem;
              background:#f0f3f6; border-radius:4px; padding:0.6rem 0.8rem;">
      このサイトはサンプル・デモ用です。確認メールは送信されません。登録後すぐにログインできます。
    </p>
    <form method="POST">
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" required>
        <small style="color:#888; font-size:0.8rem;">
          8文字以上、大文字・小文字・数字・記号を含む
        </small>
      </div>
      <div class="form-group">
        <label for="password_confirm">パスワード（確認）</label>
        <input type="password" id="password_confirm" name="password_confirm" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">
        登録する
      </button>
    </form>
    <p style="text-align:center; margin-top:1.2rem; font-size:0.88rem; color:#666;">
      すでにアカウントをお持ちの方は
      <a href="{{ url_for('login') }}">ログイン</a>
    </p>
  </div>
</div>
{% endblock %}
