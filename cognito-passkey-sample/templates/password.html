{% extends "base.html" %}
{% block title %}パスワード変更{% endblock %}

{% block content %}
<div style="max-width: 420px;">
  <div class="card">
    <h1>パスワード変更</h1>
    <form method="POST">
      <div class="form-group">
        <label for="old_password">現在のパスワード</label>
        <input type="password" id="old_password" name="old_password" required autofocus>
      </div>
      <div class="form-group">
        <label for="new_password">新しいパスワード</label>
        <input type="password" id="new_password" name="new_password" required>
        <small style="color:#888; font-size:0.8rem;">
          8文字以上、大文字・小文字・数字・記号を含む
        </small>
      </div>
      <div class="form-group">
        <label for="new_password_confirm">新しいパスワード（確認）</label>
        <input type="password" id="new_password_confirm" name="new_password_confirm" required>
      </div>
      <div style="display:flex; gap:0.75rem; margin-top:1.2rem;">
        <button type="submit" class="btn btn-primary">変更する</button>
        <a href="{{ url_for('profile') }}" class="btn btn-secondary">キャンセル</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
