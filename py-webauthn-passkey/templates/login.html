{% extends "base.html" %}
{% block title %}ログイン{% endblock %}

{% block content %}
<div style="max-width: 380px; margin: 4rem auto; display: flex; flex-direction: column; gap: 1rem;">

  <!-- パスワードログイン -->
  <div class="card">
    <h1 style="text-align:center; margin-bottom:1.5rem;">ログイン</h1>
    <form method="POST" onsubmit="saveEmailCookie(document.getElementById('username').value)">
      <div class="form-group">
        <label for="username">メールアドレス</label>
        <input type="email" id="username" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">
        ログイン
      </button>
    </form>
    <p style="text-align:center; margin-top:1.2rem; font-size:0.88rem; color:#666;">
      アカウントをお持ちでない方は
      <a href="{{ url_for('signup') }}">新規登録</a>
    </p>
  </div>

  <!-- パスキーログイン -->
  <div class="card">
    <div class="form-group">
      <label for="passkey-email">メールアドレス（省略可）</label>
      <input type="email" id="passkey-email"
             placeholder="入力すると1回の認証で完了します">
    </div>
    <button id="btn-passkey-login" class="btn btn-secondary" style="width:100%;"
            onclick="handlePasskeyLogin()">
      🔑 パスキーでログイン
    </button>
    <p id="passkey-progress"
       style="margin-top:0.6rem; font-size:0.85rem; color:#666; display:none;"></p>
    <p id="passkey-err"
       style="margin-top:0.6rem; font-size:0.85rem; color:#e74c3c; display:none;"></p>
    <p style="margin-top:0.75rem; font-size:0.78rem; color:#aaa; text-align:center;">
      メールアドレスを省略した場合、パスキーの操作が2回必要になります
    </p>
  </div>

</div>

<script src="{{ url_for('static', filename='passkey.js') }}"></script>
<script>
  function handlePasskeyLogin() {
    const btn      = document.getElementById('btn-passkey-login');
    const err      = document.getElementById('passkey-err');
    const progress = document.getElementById('passkey-progress');
    const email    = document.getElementById('passkey-email').value.trim();

    btn.disabled = true;
    btn.textContent = '認証中...';
    err.style.display = 'none';
    progress.style.display = 'none';

    loginWithPasskey(
      email,
      () => { window.location.href = '/profile'; },
      (msg) => {
        err.textContent = msg;
        err.style.display = 'block';
        progress.style.display = 'none';
        btn.textContent = '🔑 パスキーでログイン';
        btn.disabled = false;
      },
      (msg) => {
        progress.textContent = msg;
        progress.style.display = 'block';
      }
    );
  }
</script>
{% endblock %}
